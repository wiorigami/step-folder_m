<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>DEFOX Mobile</title>
    <link rel="icon" href="./icon-512x512.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/mobile.css">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>

<body>

    <!-- ============================================================
    HEADER — compact top bar
    ============================================================ -->
    <header id="mobile-header">
        <span class="header-left">
            <img src="./icon-512x512.png" alt="DEFOX" class="header-icon">
            <b>DEFOX</b>
        </span>
        <span class="header-right">
            <button id="new" title="New"><i class="bi bi-file-earmark-plus"></i></button>
            <button id="import_proj" title="Open"><i class="bi bi-upload"></i></button>
            <button id="save_proj" title="Save"><i class="bi bi-floppy"></i></button>
            <button id="export" title="Export"><i class="bi bi-download"></i></button>
        </span>
    </header>

    <!-- ============================================================
    CANVAS CONTAINER — fills remaining space
    ============================================================ -->
    <main id="canvas-container">

        <!-- Step navigation -->
        <div class="step-nav-inline">
            <button id="prev"><i class="bi bi-caret-left-fill"></i></button>
            <span class="step-info">
                <b id="step">1</b><b>/</b><b id="steps">1</b>
            </span>
            <button id="next"><i class="bi bi-caret-right-fill"></i></button>
            <input id="range_steps" type="range" min="1" max="2" value="2">
        </div>

        <!-- SVG canvas panels -->
        <div id="states" class="canvases">
            <svg id="state3" class="paint"></svg>
            <svg id="state0" class="paint"></svg>
            <svg id="cp3" class="paint" style="display: none;"></svg>
            <svg id="cp_catalyst" class="paint" style="display: none;"></svg>
        </div>

        <!-- Hidden utility SVGs -->
        <svg id="tutorial" style="display: none;"></svg>
        <svg id="svgout" style="display: none;"></svg>
        <svg id="png" style="display: none;"></svg>
        <svg id="defs"></svg>

        <!-- Loading overlay -->
        <div id="loading" class="loading"></div>
    </main>

    <!-- ============================================================
    BOTTOM TOOLBAR — scrollable, primary actions
    ============================================================ -->
    <nav id="mobile-bottom-bar">
        <button class="tool-btn" id="btn-edit-cp" title="Edit CP"><i class="bi bi-pencil-square"></i> CP</button>
        <button class="tool-btn" id="btn-flip" title="Flip"><i class="bi bi-arrow-down-up"></i></button>
        <button class="tool-btn" id="btn-layer-toggle" title="CP/Dia"><i class="bi bi-layers"></i></button>
        <button class="tool-btn" id="btn-add-symbol" title="Symbols"><i class="bi bi-star"></i> Sym</button>
        <button class="tool-btn" id="btn-open-settings" title="Settings"><i class="bi bi-sliders"></i> More</button>
    </nav>

    <!-- ============================================================
    BOTTOM SHEET — all control panels + page preview
    ============================================================ -->
    <aside id="bottom-sheet" class="hidden">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <b>Controls & Settings</b>
            <button id="btn-close-sheet"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="sheet-content">

            <!-- Project I/O -->
            <span id="edit_cp_b" class="openclose"><b>Project</b></span>
            <span id="edit_cp" class="sheet-section">
                <p>
                    <input type="text" id="proj_name" value="NewProject">
                    <button id="import0"><i class="bi bi-plus-square"></i> Import CP</button>
                    <button id="remove"><i class="bi bi-x-square"></i> Remove</button>
                </p>
                <p>
                    <select id="export_ext">
                        <option value="cp">.cp</option>
                        <option value="svg">.svg</option>
                        <option value="cell_svg">cell.svg</option>
                        <option value="png">.png</option>
                    </select>
                    <input type="checkbox" id="crease_interp" checked>
                    <label for="crease_interp">Crease Interp</label>
                </p>
                <p>
                    <button id="opencpeditor"><i class="bi bi-pencil-square"></i> Edit CP</button>
                    <button id="duplicate_backward"><i class="bi bi-arrow-bar-left"></i><i class="bi bi-copy"></i></button>
                    <button id="duplicate_forward"><i class="bi bi-copy"></i><i class="bi bi-arrow-bar-right"></i></button>
                </p>
                <p>
                    <button id="sweep">Sweep Creases</button>
                    <button id="extrapolate">Extrapolate Creases</button>
                </p>
            </span>

            <!-- Distortion -->
            <span id="edit_dist_b" class="openclose"><b>Distortion</b></span>
            <span id="edit_dist" style="display: inline;" class="sheet-section">
                <p>
                    <button id="catalyst_layers">CCP / CP</button>
                    <button id="opengekko" class="gryph"><i class="bi bi-pencil-square"></i></button>
                </p>
                <div class="slider-row">
                    <label for="p0">Level</label>
                    <input type="range" id="p0" min="0" max="1" value="0.0" step="0.0001">
                    <button id="p0_reset">Reset</button>
                </div>
                <div class="slider-row">
                    <label for="p2">Skew</label>
                    <input type="range" id="p2" min="0" max="1" value="0.0" step="0.0001">
                    <button id="p2_reset">Reset</button>
                </div>
                <div class="slider-row">
                    <label for="p1">Angle</label>
                    <input type="range" id="p1" min="0" max="1" value="0.5" step="0.0001">
                    <button id="p1_reset">Reset</button>
                </div>
            </span>

            <!-- Render -->
            <span id="edit_render_b" class="openclose"><b>Render</b></span>
            <span id="edit_render" class="sheet-section">
                <p>
                    <button id="cp_layers">CP / Dia</button>
                    <button id="flip"><i class="bi bi-arrow-down-up"></i> Flip</button>
                    <button id="render_reset">Reset View</button>
                    <button id="infer_prev"><i class="bi bi-box-arrow-in-right"></i></button>
                    <button id="infer_next"><i class="bi bi-box-arrow-in-left"></i></button>
                </p>
                <div class="slider-row">
                    <label for="scale">Zoom</label>
                    <input id="scale" type="range" max="20" min="0" value="1" step="1">
                    <button id="scale_reset">Reset</button>
                </div>
                <div class="slider-row">
                    <label for="rotate">Angle</label>
                    <input id="rotate" type="range" max="1" min="0" value="0.5" step="0.125">
                    <button id="rotate_reset">Reset</button>
                </div>
                <div class="slider-row">
                    <label for="clip">Clip</label>
                    <input id="clip" type="range" max="1" min="0" value="0.0" step="0.001">
                    <button id="clip_reset">Reset</button>
                </div>
                <div class="slider-row">
                    <label for="depth">Depth</label>
                    <input id="depth" type="range" max="1" min="0" value="0" step="1">
                    <button id="depth_reset">Reset</button>
                </div>
            </span>

            <!-- Manual Layer Control -->
            <span id="option_layers_b" class="openclose"><b>Layers</b></span>
            <span id="option_layers" class="sheet-section">
                <p>
                    <button id="infer_layer_order_forward"><i class="bi bi-box-arrow-in-right"></i></button>
                    <button id="infer_layer_order_backward"><i class="bi bi-box-arrow-in-left"></i></button>
                </p>
                <p>
                    <label for="selectG">Group</label>
                    <select id="selectG"></select>
                    <label for="assign">State</label>
                    <input type="number" id="assign" min="1" max="1" value="1">
                    <a id="assigns">/ 1</a>
                </p>
                <p>
                    <label for="assign_limit">Limit</label>
                    <input type="number" id="assign_limit" min="0" value="0" max="1000">
                </p>
                <p>
                    <button id="apply_tt">Resolve Cyclic Orders</button>
                </p>
            </span>

            <!-- Symbols -->
            <span id="edit_symbol_b" class="openclose"><b>Symbols</b></span>
            <span id="edit_symbol" class="sheet-section">
                <p class="tool_buttons">
                    <button id="axanael_open"><i class="bi bi-pencil-square"></i> Open Symbol Editor</button>
                </p>
            </span>

            <!-- Page Preview (populated by JS from preview.xml) -->
            <span class="openclose"><b>Page Preview</b></span>
            <div id="preview" class="preview sheet-section"></div>
        </div>
    </aside>

    <!-- Sheet overlay (tap to close) -->
    <div id="sheet-overlay" class="hidden"></div>

    <!-- ============================================================
    DIALOGS — keep at body level for showModal()
    ============================================================ -->
    <dialog id="cpeditor" class="cpeditor"></dialog>
    <dialog id="axanael" class="axanael"></dialog>
    <dialog id="gekko" class="gekko"></dialog>

    <!-- ============================================================
    FOOTER
    ============================================================ -->
    <footer id="mobile-footer">
        <p><a href="https://youtu.be/MNiAYSwBwfY">Intro Video</a> · <a href="https://github.com/kei-morisue/step-folder">Repo</a> · <a href="https://github.com/kei-morisue/step-folder/blob/082abe77fdcd4178888780c07f0a26a9bc11df9c/Affine_Distortions.pdf">Paper</a></p>
        <p><b>© Kei Morisue 2024, 2026</b></p>
    </footer>

    <script type="module" src="./src/main.js?v1.0.0"></script>

    <!-- Mobile UI glue — bottom sheet + bottom bar + touch guard -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // ============================================================
        // BOTTOM SHEET — slide-up drawer
        // ============================================================
        var bottomSheet = document.getElementById("bottom-sheet");
        var overlay = document.getElementById("sheet-overlay");
        var btnOpenSettings = document.getElementById("btn-open-settings");
        var btnCloseSheet = document.getElementById("btn-close-sheet");

        // Remove hidden class so CSS transitions work
        bottomSheet.classList.remove("hidden");
        overlay.classList.remove("hidden");

        function openSheet() {
            bottomSheet.classList.add("active");
            overlay.classList.add("active");
        }
        function closeSheet() {
            bottomSheet.classList.remove("active");
            overlay.classList.remove("active");
        }

        btnOpenSettings.addEventListener("click", openSheet);
        btnCloseSheet.addEventListener("click", closeSheet);
        overlay.addEventListener("click", closeSheet);

        // ============================================================
        // BOTTOM TOOLBAR — active state + bridge to original handlers
        // ============================================================
        var toolBtns = document.querySelectorAll(".tool-btn:not(#btn-open-settings)");
        toolBtns.forEach(function(btn) {
            btn.addEventListener("click", function() {
                toolBtns.forEach(function(b) { b.classList.remove("active"); });
                btn.classList.add("active");
            });
        });

        // Bridge new buttons → existing DEFOX handlers (by clicking original hidden buttons)
        function bridge(newId, originalId) {
            var newBtn = document.getElementById(newId);
            if (newBtn) {
                newBtn.addEventListener("click", function() {
                    var orig = document.getElementById(originalId);
                    if (orig) orig.click();
                });
            }
        }
        bridge("btn-edit-cp", "opencpeditor");
        bridge("btn-flip", "flip");
        bridge("btn-layer-toggle", "cp_layers");
        bridge("btn-add-symbol", "axanael_open");

        // ============================================================
        // CANVAS TOUCH GUARD — prevent browser gestures
        // ============================================================
        var canvasContainer = document.getElementById("canvas-container");
        canvasContainer.addEventListener("touchstart", function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    });
    </script>
</body>

</html>
